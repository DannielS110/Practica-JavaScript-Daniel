<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculadora de compra</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    <main><a class="volver" href="../index.html">← Volver al inicio</a>
        <h1>Calculadora de compra</h1><label for="precio">Precio unitario ($)</label><input id="precio" type="number"
            min="0" step="any" placeholder="12.50"><label for="cantidad">Cantidad</label><input id="cantidad"
            type="number" min="1" step="1" placeholder="3"><button id="calcular">Calcular total</button>
        <div id="resultado" class="resultado" aria-live="polite"></div>
    </main>
    <script src="script.js"></script>
</body>

</html>
